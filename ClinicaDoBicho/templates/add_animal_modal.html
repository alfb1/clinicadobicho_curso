
<!-- add_animal_modal.html -->
 <div class="modal fade" id="animalModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <h5 class="modal-title">
                    Add Pet
                </h5>
                <button class="btn-close" data-bs-dismiss="modal" aria-label="Close" ></button>
            </div>
            <div class="modal-body">
                <form id="animalForm">
                {% csrf_token %}
                {{ form_pet.as_p }}
                <input type="hidden" name="cpf" value="{{ cliente.cpf }}">
                <button type="submit" class="btn btn-primary">Salvar</button>
                </form>
            </div>
        </div>    
    </div>
 </div>

 <!--- Jquery-->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $('#animalForm').submit(function(e){
        e.preventDefault();
        $.ajax({
            url:"/add_animal/",
            method:"POST",
            data:$(this).serialize(),
            success:function(data){
                // close Modal Form
                $('#animalModal').modal('hide');
                // add new animal to list
                let html_option = `<li class="list-group-item">
                    <strong>${data.nome}</strong>
                    <button type="button" class="btn btn-info btn-sm select-animal-btn"
                            data-animal-id="${data.id}">Selecionar></button>
                    </li>`;
                $('#animalList').append(html_option);
                
                let newOption = new Option(data.nome, data.id, true, true);
                $('#id_animal').append(newOption).trigger('change');
            },
            error:function(xhr){
                alert('Erro ao adicionar animal');
            }
        });
    });
</script>

<button type="button" class="btn btn-sm btn-sucess" data-bs-toggle="modal" data-bs-target="#animalModal">
    + Animal
</button>

<script>
    $('#animalModal').on('show.bs.modal', function(){
        $('#modalContent').load("{% url 'add_animal' %}");
    })
</script>
